<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Vinyl Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140f;
    --bg-alt: #1f1a13;
    --sleeve: #ece2cc;
    --sleeve-dim: #d9cbaa;
    --ink: #2a2318;
    --paper-text: #f5efe0;
    --paper-text-dim: #b8ac93;
    --amber: #c9932a;
    --amber-bright: #e0aa3d;
    --rust: #a8452f;
    --rust-bright: #c25539;
    --teal: #3f6e64;
    --line: rgba(245,239,224,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,147,42,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(168,69,47,0.05), transparent 45%);
    color: var(--paper-text);
    font-family: 'Fraunces', Georgia, serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* Header */
  header{
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px;
    padding-bottom: 22px; margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark{ display:flex; align-items:center; gap:14px; }
  .disc{
    width:46px; height:46px; border-radius:50%;
    background: repeating-radial-gradient(circle at center, #0c0a07 0px, #0c0a07 2px, #24201a 3px, #24201a 4px);
    position:relative; flex-shrink:0;
    box-shadow: 0 0 0 1px rgba(245,239,224,0.08);
  }
  .disc::after{
    content:''; position:absolute; inset:0; margin:auto; width:16px; height:16px; border-radius:50%;
    background: var(--rust); box-shadow: inset 0 0 0 4px #0c0a07;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 42px; letter-spacing: 3px; line-height:1;
    margin:0; color: var(--paper-text); font-weight:400;
  }
  .tagline{ font-size:13px; color:var(--paper-text-dim); letter-spacing:0.4px; margin-top:4px; font-style:italic;}
  .header-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sheet-link{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--paper-text-dim);
    text-decoration:none; border:1px solid var(--line); padding:8px 12px; border-radius:3px;
    letter-spacing:0.5px; transition: all .15s ease;
  }
  .sheet-link:hover{ border-color: var(--amber); color: var(--amber-bright); }

  /* Stats bar */
  .stats{
    display:flex; gap:0; margin-bottom:26px; border:1px solid var(--line); border-radius:4px; overflow:hidden;
  }
  .stat{ flex:1; padding:14px 18px; border-right:1px solid var(--line); }
  .stat:last-child{ border-right:none; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:24px; color:var(--amber-bright); font-weight:600; }
  .stat .label{ font-size:11px; color:var(--paper-text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}

  /* Controls */
  .controls{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 22px;
  }
  .search-box{
    flex:1; min-width:220px; position:relative;
  }
  .search-box input{
    width:100%; background: var(--bg-alt); border:1px solid var(--line); color:var(--paper-text);
    padding:11px 14px; border-radius:3px; font-family:'Fraunces',serif; font-size:15px;
  }
  .search-box input:focus{ outline:none; border-color:var(--amber); }
  .search-box input::placeholder{ color: var(--paper-text-dim); }

  .divider-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.8px; text-transform:uppercase;
    padding:9px 14px; border:1px solid var(--line); border-radius:3px; cursor:pointer; background:transparent;
    color:var(--paper-text-dim); transition: all .15s ease;
  }
  .tab:hover{ border-color: var(--amber); color: var(--paper-text); }
  .tab.active{ background: var(--amber); border-color: var(--amber); color: #17140f; font-weight:600; }

  select{
    background: var(--bg-alt); border:1px solid var(--line); color:var(--paper-text);
    padding:10px 12px; border-radius:3px; font-family:'IBM Plex Mono', monospace; font-size:12px; cursor:pointer;
  }

  .add-btn{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.8px; text-transform:uppercase;
    padding:11px 20px; border-radius:3px; border:1px solid var(--rust); background:var(--rust); color:#f5efe0;
    cursor:pointer; font-weight:600; transition: all .15s ease; white-space:nowrap;
  }
  .add-btn:hover{ background: var(--rust-bright); border-color:var(--rust-bright); }

  /* Grid */
  .count-line{ font-size:12px; color:var(--paper-text-dim); margin-bottom:14px; font-family:'IBM Plex Mono', monospace; letter-spacing:0.4px;}
  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px;
  }
  .card{
    background: var(--sleeve); border-radius:4px; padding:16px 16px 14px; position:relative; overflow:hidden;
    color: var(--ink); cursor:default; transition: transform .18s ease, box-shadow .18s ease;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .card:hover{ transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.35); }
  .card::before{
    content:''; position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%;
    background: repeating-radial-gradient(circle at center, #0c0a07 0px, #0c0a07 1.5px, transparent 2px, transparent 4px);
    opacity:0; transition: opacity .18s ease, transform .5s ease;
    transform: rotate(0deg);
  }
  .card:hover::before{ opacity:0.85; transform: rotate(75deg); }
  .card-year{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--rust); font-weight:600; letter-spacing:0.5px;
  }
  .card-artist{
    font-family:'Bebas Neue', sans-serif; font-size:20px; letter-spacing:0.5px; line-height:1.05; margin-top:6px;
    color: var(--ink);
  }
  .card-title{
    font-size:14px; font-style:italic; color:#4a4030; margin-top:3px; line-height:1.3;
  }
  .card-footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px;
    border-top: 1px dashed rgba(0,0,0,0.15);
  }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.6px;
    padding:3px 7px; border-radius:2px; font-weight:600;
  }
  .badge.vinyl{ background:rgba(63,110,100,0.18); color:#2d5048; }
  .badge.cd{ background:rgba(168,69,47,0.15); color:#8a3a26; }
  .badge.box{ background:rgba(201,147,42,0.2); color:#8a651c; }
  .badge.wishlist{ background:rgba(168,69,47,0.9); color:#f5efe0; }
  .badge.collection{ background:rgba(63,110,100,0.9); color:#f5efe0; }
  .list-badge{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.6px; padding:3px 7px; border-radius:2px; }

  .empty{
    text-align:center; padding: 60px 20px; color: var(--paper-text-dim);
  }
  .empty .disc{ margin: 0 auto 18px; width:60px; height:60px; }
  .empty .disc::after{ width:20px; height:20px; }
  .empty h3{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:var(--paper-text); margin:0 0 6px; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(10,8,5,0.75); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--sleeve); color: var(--ink); border-radius:6px; width:100%; max-width:460px;
    padding: 28px 26px 24px; position:relative; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .modal-tape{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:90px; height:26px; background: rgba(201,147,42,0.55); border:1px solid rgba(0,0,0,0.05);
  }
  .modal h2{
    font-family:'Bebas Neue', sans-serif; font-size:26px; letter-spacing:1px; margin:6px 0 18px; color:var(--ink);
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.8px; color:#6b5f47; margin-bottom:5px;
  }
  .field input, .field select{
    width:100%; padding:10px 11px; border-radius:3px; border:1px solid rgba(0,0,0,0.18);
    background: #fbf7ec; font-family:'Fraunces',serif; font-size:14.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--rust); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-primary{
    flex:1; background: var(--rust); color:#f5efe0; border:none; padding:12px; border-radius:3px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.8px;
    font-weight:600; cursor:pointer; transition: background .15s ease;
  }
  .btn-primary:hover{ background: var(--rust-bright); }
  .btn-secondary{
    background: transparent; color:#6b5f47; border:1px solid rgba(0,0,0,0.18); padding:12px 18px; border-radius:3px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.8px;
    cursor:pointer;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:none; border:none; font-size:20px; color:#8a7f66;
    cursor:pointer; line-height:1; padding:4px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background: var(--teal); color:#f5efe0; padding:12px 22px; border-radius:4px; font-size:13px;
    font-family:'IBM Plex Mono', monospace; letter-spacing:0.4px; transition: all .25s ease; z-index:200;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{
    margin-top: 50px; padding-top: 20px; border-top:1px solid var(--line);
    font-size:11px; color: var(--paper-text-dim); font-family:'IBM Plex Mono', monospace;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  a{ color: inherit; }

  @media (max-width:560px){
    h1{ font-size:32px; }
    .stats{ flex-wrap:wrap; }
    .stat{ flex:1 1 50%; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-mark">
      <div class="disc"></div>
      <div>
        <h1>THE STACKS</h1>
        <div class="tagline">a personal crate, digitized</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="sheet-link" id="resetBtn" style="cursor:pointer;">↺ reset data</button>
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1oR_Y4_yURp0VoEJPoFu1vZKd3VZoF8d_a9g9AELuhdw/edit" target="_blank" rel="noopener">↗ open source sheet</a>
    </div>
  </header>

  <div class="stats" id="statsBar"></div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search artist or title…" />
    </div>
    <div class="divider-tabs" id="listTabs"></div>
    <select id="decadeFilter">
      <option value="all">All decades</option>
    </select>
    <select id="sortSelect">
      <option value="artist">Sort: Artist A–Z</option>
      <option value="year">Sort: Year</option>
      <option value="dateAdded">Sort: Recently added</option>
    </select>
    <button class="add-btn" id="openAddBtn">+ Add to the crate</button>
  </div>

  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>

  <footer>
    <span>Data stored locally in this app · originally seeded from your Google Sheet</span>
    <span id="lastSync"></span>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-tape"></div>
    <button class="modal-close" id="closeModal">×</button>
    <h2>New arrival</h2>
    <form id="addForm">
      <div class="field">
        <label>Artist</label>
        <input type="text" id="fArtist" required placeholder="e.g. The Cure" />
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="fTitle" required placeholder="e.g. Disintegration" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Year</label>
          <input type="text" id="fYear" placeholder="1989" />
        </div>
        <div class="field">
          <label>Format</label>
          <select id="fFormat">
            <option>Vinyl</option>
            <option>CD</option>
            <option>Box Set</option>
            <option>Cassette</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>List</label>
        <select id="fList">
          <option value="collection">Collection</option>
          <option value="wishlist">Wishlist</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn-primary">Add record</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

1978", "list": "collection"}];
const STORAGE_KEY = 'vinyl-records-v1';
const SHEET_ID = '1oR_Y4_yURp0VoEJPoFu1vZKd3VZoF8d_a9g9AELuhdw';

let records = [];
let activeList = 'all';
let activeDecade = 'all';
let sortMode = 'artist';
let searchTerm = '';

async function loadRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length > 0){
        records = parsed;
        return;
      }
      // stored value exists but is empty/corrupted — fall through to reseed
    }
  }catch(e){ /* not found yet or storage unavailable */ }
  records = SEED_RECORDS.slice();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }catch(e){}
}

async function saveRecords(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }catch(e){
    console.error('save failed', e);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 3200);
}

function decadeOf(yearStr){
  const y = parseInt(yearStr, 10);
  if(!y || isNaN(y)) return null;
  return Math.floor(y/10)*10;
}

function formatBadgeClass(fmt){
  const f = (fmt||'').toLowerCase();
  if(f.includes('cd')) return 'cd';
  if(f.includes('box')) return 'box';
  return 'vinyl';
}

function renderStats(){
  const total = records.length;
  const collection = records.filter(r=>r.list==='collection').length;
  const wishlist = records.filter(r=>r.list==='wishlist').length;
  const artists = new Set(records.map(r=>r.artist)).size;
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Total records</div></div>
    <div class="stat"><div class="num">${collection}</div><div class="label">In collection</div></div>
    <div class="stat"><div class="num">${wishlist}</div><div class="label">On wishlist</div></div>
    <div class="stat"><div class="num">${artists}</div><div class="label">Artists</div></div>
  `;
}

function renderTabs(){
  const tabs = document.getElementById('listTabs');
  const opts = [['all','All'],['collection','Collection'],['wishlist','Wishlist']];
  tabs.innerHTML = opts.map(([val,label])=>
    `<button class="tab ${activeList===val?'active':''}" data-list="${val}">${label}</button>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeList = btn.dataset.list; renderTabs(); renderGrid(); });
  });
}

function renderDecadeOptions(){
  const sel = document.getElementById('decadeFilter');
  const decades = new Set();
  records.forEach(r=>{ const d = decadeOf(r.year); if(d) decades.add(d); });
  const sorted = Array.from(decades).sort((a,b)=>a-b);
  sel.innerHTML = '<option value="all">All decades</option>' +
    sorted.map(d=>`<option value="${d}">${d}s</option>`).join('');
}

function getFiltered(){
  let list = records.slice();
  if(activeList !== 'all') list = list.filter(r=>r.list===activeList);
  if(activeDecade !== 'all') list = list.filter(r=>decadeOf(r.year)===parseInt(activeDecade,10));
  if(searchTerm){
    const s = searchTerm.toLowerCase();
    list = list.filter(r => r.artist.toLowerCase().includes(s) || r.title.toLowerCase().includes(s));
  }
  if(sortMode === 'artist'){
    list.sort((a,b)=> a.artist.localeCompare(b.artist) || (parseInt(a.year)||0)-(parseInt(b.year)||0));
  } else if(sortMode === 'year'){
    list.sort((a,b)=> (parseInt(a.year)||9999)-(parseInt(b.year)||9999));
  } else if(sortMode === 'dateAdded'){
    list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  }
  return list;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const filtered = getFiltered();
  document.getElementById('countLine').textContent = `${filtered.length} record${filtered.length===1?'':'s'} shown`;

  if(filtered.length === 0){
    grid.innerHTML = '';
    grid.parentElement.querySelectorAll('.empty').forEach(e=>e.remove());
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="disc"></div><h3>Nothing here</h3><div>Try a different search or filter.</div>`;
    grid.after(empty);
    return;
  }
  document.querySelectorAll('.empty').forEach(e=>e.remove());

  grid.innerHTML = filtered.map(r => `
    <div class="card">
      <div class="card-year">${r.year || '—'}</div>
      <div class="card-artist">${escapeHtml(r.artist)}</div>
      <div class="card-title">${escapeHtml(r.title)}</div>
      <div class="card-footer">
        <span class="badge ${formatBadgeClass(r.format)}">${escapeHtml(r.format||'Vinyl')}</span>
        <span class="list-badge ${r.list}">${r.list}</span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function openModal(){ document.getElementById('modalOverlay').classList.add('open'); document.getElementById('fArtist').focus(); }
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('addForm').reset();
}

async function handleAdd(e){
  e.preventDefault();
  const artist = document.getElementById('fArtist').value.trim();
  const title = document.getElementById('fTitle').value.trim();
  const year = document.getElementById('fYear').value.trim();
  const format = document.getElementById('fFormat').value;
  const list = document.getElementById('fList').value;
  if(!artist || !title) return;

  const newRecord = {
    id: 'r' + Date.now(),
    date: new Date().toISOString().slice(0,10),
    artist, title, format, year, list
  };
  records.push(newRecord);
  await saveRecords();
  renderStats();
  renderDecadeOptions();
  renderGrid();
  closeModal();
  showToast(`Added "${title}" to your ${list}. Don't forget to add it to your Google Sheet too — tap the link above.`);
}

function wireControls(){
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value; renderGrid();
  });
  document.getElementById('decadeFilter').addEventListener('change', (e)=>{
    activeDecade = e.target.value; renderGrid();
  });
  document.getElementById('sortSelect').addEventListener('change', (e)=>{
    sortMode = e.target.value; renderGrid();
  });
  document.getElementById('openAddBtn').addEventListener('click', openModal);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelAdd').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('addForm').addEventListener('submit', handleAdd);
  document.getElementById('resetBtn').addEventListener('click', async () => {
    if(confirm('Reset the app back to your original 314-record collection? This clears any records you added locally in the app (your Google Sheet is not affected).')){
      records = SEED_RECORDS.slice();
      await saveRecords();
      renderStats(); renderTabs(); renderDecadeOptions(); renderGrid();
      document.getElementById('searchInput').value = '';
      searchTerm = '';
      showToast('Reset complete — showing your original collection.');
    }
  });
}

async function init(){
  try{
    await loadRecords();
  }catch(e){
    console.error('init load failed, using seed data', e);
    records = SEED_RECORDS.slice();
  }
  renderStats();
  renderTabs();
  renderDecadeOptions();
  renderGrid();
  wireControls();
  document.getElementById('lastSync').textContent = `${records.length} records loaded`;
}

init();
</script>
